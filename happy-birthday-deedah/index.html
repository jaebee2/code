<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Happy Birthday My Deedah ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
          rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ========================================================= -->
    <!-- Animated Background Layer                                 -->
    <!-- ========================================================= -->

    <div id="background-layer"></div>

    <!-- ========================================================= -->
    <!-- Main Application Container                                -->
    <!-- ========================================================= -->

    <div id="app">

        <!-- ===================================================== -->
        <!-- LOADING SCREEN                                         -->
        <!-- ===================================================== -->

        <div id="loading-screen">

            <div class="loading-container">

                <!-- Heart -->
                <div class="loading-heart">
                    ❤️
                </div>

                <!-- Main Title -->
                <h1 class="loading-title">
                    Happy Birthday
                </h1>

                <!-- Subtitle -->
                <h2 class="loading-subtitle">
                    Senior MM
                </h2>

                <!-- Loading Text -->
                <p class="loading-text">
                    Preparing Something Beautiful...
                </p>

                <!-- Progress Bar -->
                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- COUNTDOWN SCREEN                                       -->
        <!-- ===================================================== -->

        <div id="countdown-screen">

            <div class="countdown-card">

                <!-- Heading -->
                <p class="countdown-heading">
                    Countdown To
                </p>

                <!-- Title -->
                <h1 class="countdown-title">
                    Happy Birthday My Deedah ❤️
                </h1>

                <!-- Description -->
                <p class="countdown-description">
                    Every second brings us closer to your special day.
                </p>

                <!-- Countdown Boxes -->
                <div class="countdown-boxes">

                    <!-- Days -->
                    <div class="count-box">

                        <span id="days">00</span>

                        <small>Days</small>

                    </div>

                    <!-- Hours -->
                    <div class="count-box">

                        <span id="hours">00</span>

                        <small>Hours</small>

                    </div>

                    <!-- Minutes -->
                    <div class="count-box">

                        <span id="minutes">00</span>

                        <small>Minutes</small>

                    </div>

                    <!-- Seconds -->
                    <div class="count-box">

                        <span id="seconds">00</span>

                        <small>Seconds</small>

                    </div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- CELEBRATION SCREEN                                     -->
        <!-- ===================================================== -->

        <div id="celebration-screen">

            <!-- White Flash Overlay -->
            <div id="flash-overlay"></div>
            <video
    id="intro-video"
    preload="auto"
    playsinline
>
    <source src="assets/videos/intro.mp4" type="video/mp4">
</video>

            <!-- Fireworks Canvas -->
            <canvas id="fireworks-canvas"></canvas>

            <!-- Confetti Container -->
            <div id="confetti-container"></div>

            <!-- Birthday Title -->
            <div id="birthday-title">

                <h1>

                    HAPPY BIRTHDAY

                </h1>

                <h2>

                    MY DEEDAH ❤️

                </h2>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- BIRTHDAY SCREEN                                        -->
        <!-- This will later contain the full birthday experience.  -->
        <!-- ===================================================== -->

       <div id="birthday-screen"
     style="position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:rgba(0,0,0,0.85);
            z-index:9999;">

    <a href="birthdaypage.html"
       class="birthday-btn"
       style="display:inline-block;
              padding:20px 45px;
              background:linear-gradient(135deg,#ff4d6d,#ff9a3d);
              color:#fff;
              text-decoration:none;
              font-size:24px;
              font-weight:bold;
              border-radius:50px;
              box-shadow:0 10px 30px rgba(255,77,109,.5);
              transition:all .3s ease;
              font-family:'Poppins',sans-serif;">

        🎁 Enter Birthday Surprise 🎁

    </a>

</div>

    </div>

    <!-- ========================================================= -->
    <!-- Main JavaScript                                            -->
    <!-- ========================================================= -->

    <script type="module"
            src="js/app.js"></script>

</body>

</html>
