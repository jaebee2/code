<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Code</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
          rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ========================================================= -->
    <!-- Animated Background Layer                                 -->
    <!-- ========================================================= -->

    <div id="background-layer"></div>

    <!-- ========================================================= -->
    <!-- Main Application Container                                -->
    <!-- ========================================================= -->

    <div id="app">

        <!-- ===================================================== -->
        <!-- LOADING SCREEN                                         -->
        <!-- ===================================================== -->

        <div id="loading-screen">

            <div class="loading-container">

                <!-- Heart -->
                <div class="loading-heart">
                
                </div>

                <!-- Main Title -->
                <h1 class="loading-title">
                    
                </h1>

                <!-- Subtitle -->
                <h2 class="loading-subtitle">
                    Wait 
                </h2>

                <!-- Loading Text -->
                <p class="loading-text">
                    loading ...
                </p>

                <!-- Progress Bar -->
                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- COUNTDOWN SCREEN                                       -->
        <!-- ===================================================== -->

        <div id="countdown-screen">
            

            <div class="countdown-card">

                <!-- Heading -->
                <p class="countdown-heading">
                   The wait is worth it 🤩👌🏼
                </p>

                <!-- Title -->
                <h1 class="countdown-title">
                    
                </h1>

                <!-- Description -->
                <p class="countdown-description">
                   Keep an Eye on the Countdown and get ready ! 👀👀
                </p>

                <!-- Countdown Boxes -->
                <div class="countdown-boxes">

                    <!-- Days -->
                    <div class="count-box">

                        <span id="days">00</span>

                        <small>Days</small>

                    </div>

                    <!-- Hours -->
                    <div class="count-box">

                        <span id="hours">00</span>

                        <small>Hours</small>

                    </div>

                    <!-- Minutes -->
                    <div class="count-box">

                        <span id="minutes">00</span>

                        <small>Minutes</small>

                    </div>

                    <!-- Seconds -->
                    <div class="count-box">

                        <span id="seconds">00</span>

                        <small>Seconds</small>

                    </div>
                    <div class="audio-unlock">

    <button id="unlock-audio-btn">

        🔊 Tap to Unlock Audio

    </button>

    <p>

        click this for sound .

    </p>

</div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- CELEBRATION SCREEN                                     -->
        <!-- ===================================================== -->

        <div id="celebration-screen">

            <!-- White Flash Overlay -->
            <div id="flash-overlay"></div>
            <video
    id="intro-video"
    preload="auto"
    playsinline
>
    <source src="assets/videos/intro.mp4" type="video/mp4">
</video>

            <!-- Fireworks Canvas -->
            <canvas id="fireworks-canvas"></canvas>

            <!-- Confetti Container -->
            <div id="confetti-container"></div>

            <!-- Birthday Title -->
            <div id="birthday-title">

                <h1>

                    HAPPY BIRTHDAY

                </h1>

                <h2>

                    MY DEEDAH ❤️‍🔥🎂🎉

                </h2>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- BIRTHDAY SCREEN                                        -->
        <!-- This will later contain the full birthday experience.  -->
        <!-- ===================================================== -->

      <<!-- ===================================================== -->
<!-- PREMIUM BIRTHDAY SCREEN -->
<!-- ===================================================== -->

<div id="birthday-screen">
    

    <!-- Floating Decorations -->

    <div class="floating-hearts"></div>
    <div class="floating-stars"></div>

    <!-- Decorative Sparkles -->

    <div class="sparkle sparkle1"></div>
    <div class="sparkle sparkle2"></div>
    <div class="sparkle sparkle3"></div>
    <div class="sparkle sparkle4"></div>
    <div class="sparkle sparkle5"></div>

  
   <div class="birthday-layout">
    

    <!-- =====================================================
         LEFT PHOTO AREA
    ====================================================== -->

    <div class="birthday-photo-side">

        <!-- Glow behind portrait -->
        <div class="photo-glow"></div>


        <!-- Floating hearts -->
        <div class="portrait-heart heart-1">❤️</div>
        <div class="portrait-heart heart-2">💕</div>
        <div class="portrait-heart heart-3">💗</div>
        <div class="portrait-heart heart-4">💖</div>
        <div class="portrait-heart heart-5">💓</div>
        <div class="portrait-heart heart-6">💞</div>


        <!-- Sparkles -->
        <div class="portrait-sparkle sparkle-1">✦</div>
        <div class="portrait-sparkle sparkle-2">✧</div>
        <div class="portrait-sparkle sparkle-3">✦</div>


      

    </div>




    <!-- =========================
         BIRTHDAY CARD
    ========================== -->

    <div class="hero-card">

        <!-- Profile -->
        <div class="profile-container">

            <img
                id="birthday-photo"
                src="assets/images/deedah.png"
                alt="My Deedah"
            >

        </div>


        <!-- Titles -->
        <h1 id="birthday-main-title"></h1>

        <h1 id="birthday-second-title"></h1>

        <h2 id="birthday-name">
            MY DEEDAH ❤️
        </h2>

        <p id="birthday-date"></p>


        <!-- Divider -->
        <div class="gold-line"></div>


        <!-- Short Message -->
        <p class="birthday-intro"></p>


       
    </div>
    

</div>
    <!-- ================================================= -->
    <!-- LOVE LETTER -->
    <!-- ================================================= -->

    <!-- ================================================= -->
<!-- PREMIUM LOVE LETTER -->
<!-- ================================================= -->

<div id="letter-overlay">

    <div id="envelope">

        <!-- Close Button -->

        <button id="close-letter">

            ✕

        </button>

        <!-- Glow -->

        <div class="envelope-glow"></div>

        <!-- Envelope -->

        <div class="envelope-back"></div>

        <div class="envelope-left"></div>

        <div class="envelope-right"></div>

        <div class="envelope-bottom"></div>

        <!-- Top Flap -->

        <div class="envelope-flap"></div>

        <!-- Wax Seal -->

        <div class="wax-seal">

            ❤️

        </div>

        <!-- LETTER -->

        <div class="letter">

            <div class="letter-shadow"></div>

            <div class="letter-paper">

                <div class="paper-header">

                    <h2 id="letter-title">

                    </h2>

                    <div class="paper-divider"></div>

                </div>

                <div class="paper-body">

                    <p id="letter-text">

                    </p>

                </div>

                <div class="paper-footer">

                    <h3>

                        Forever Yours ❤️

                    </h3>

                    <span>

                        Senior MM

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

    <!-- ========================================================= -->
    <!-- Main JavaScript                                            -->
    <!-- ========================================================= -->

    <script type="module"
            src="js/app.js"></script>

</body>

</html>
