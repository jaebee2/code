<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday My Deedah ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
          rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Animated Background -->
    <div id="background-layer"></div>

    <!-- Entire Website -->
    <div id="app">
        <div id="loading-screen">

            <div class="loading-container">

                <div class="loading-heart">
                    ❤️
                </div>

                <h1 class="loading-title">
                    Happy Birthday
                </h1>

                <h2 class="loading-subtitle">
                    Senior MM
                </h2>

                <p class="loading-text">
                    Preparing Something Beautiful...
                </p>

                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- COUNTDOWN SCREEN                                       -->
        <!-- ===================================================== -->

        <div id="countdown-screen">

            <div class="countdown-card">

                <p class="countdown-heading">

                    Countdown To

                </p>

                <h1 class="countdown-title">

                    Happy Birthday My Deedah ❤️

                </h1>

                <p class="countdown-description">

                    Every second brings us closer to your special day.

                </p>

                <div class="countdown-boxes">

                    <div class="count-box">

                        <span id="days">00</span>

                        <small>Days</small>

                    </div>

                    <div class="count-box">

                        <span id="hours">00</span>

                        <small>Hours</small>

                    </div>

                    <div class="count-box">

                        <span id="minutes">00</span>

                        <small>Minutes</small>

                    </div>

                    <div class="count-box">

                        <span id="seconds">00</span>

                        <small>Seconds</small>

                    </div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- Celebration Screen                                     -->
        <!-- ===================================================== -->

        <div id="celebration-screen"></div>

        <!-- ===================================================== -->
        <!-- Birthday Screen                                        -->
        <!-- ===================================================== -->

        <div id="birthday-screen"></div>

    </div>
</div>

    <!-- ========================================================= -->
    <!-- Main JavaScript                                           -->
    <!-- ========================================================= -->

    <script type="module"
            src="js/app.js"></script>

</body>

</html>
