<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Happy Birthday My Deedah ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
          rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ========================================================= -->
    <!-- Animated Background Layer                                 -->
    <!-- ========================================================= -->

    <div id="background-layer"></div>

    <!-- ========================================================= -->
    <!-- Main Application Container                                -->
    <!-- ========================================================= -->

    <div id="app">

        <!-- ===================================================== -->
        <!-- LOADING SCREEN                                         -->
        <!-- ===================================================== -->

        <div id="loading-screen">

            <div class="loading-container">

                <!-- Heart -->
                <div class="loading-heart">
                    ❤️
                </div>

                <!-- Main Title -->
                <h1 class="loading-title">
                    Happy Birthday
                </h1>

                <!-- Subtitle -->
                <h2 class="loading-subtitle">
                    Senior MM
                </h2>

                <!-- Loading Text -->
                <p class="loading-text">
                    Preparing Something Beautiful...
                </p>

                <!-- Progress Bar -->
                <div class="progress-bar">

                    <div class="progress-fill"></div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- COUNTDOWN SCREEN                                       -->
        <!-- ===================================================== -->

        <div id="countdown-screen">

            <div class="countdown-card">

                <!-- Heading -->
                <p class="countdown-heading">
                    Countdown To
                </p>

                <!-- Title -->
                <h1 class="countdown-title">
                    Happy Birthday My Deedah ❤️
                </h1>

                <!-- Description -->
                <p class="countdown-description">
                    Every second brings us closer to your special day.
                </p>

                <!-- Countdown Boxes -->
                <div class="countdown-boxes">

                    <!-- Days -->
                    <div class="count-box">

                        <span id="days">00</span>

                        <small>Days</small>

                    </div>

                    <!-- Hours -->
                    <div class="count-box">

                        <span id="hours">00</span>

                        <small>Hours</small>

                    </div>

                    <!-- Minutes -->
                    <div class="count-box">

                        <span id="minutes">00</span>

                        <small>Minutes</small>

                    </div>

                    <!-- Seconds -->
                    <div class="count-box">

                        <span id="seconds">00</span>

                        <small>Seconds</small>

                    </div>

                </div>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- CELEBRATION SCREEN                                     -->
        <!-- ===================================================== -->

        <div id="celebration-screen">

            <!-- White Flash Overlay -->
            <div id="flash-overlay"></div>
            <video
    id="intro-video"
    preload="auto"
    playsinline
>
    <source src="assets/videos/intro.mp4" type="video/mp4">
</video>

            <!-- Fireworks Canvas -->
            <canvas id="fireworks-canvas"></canvas>

            <!-- Confetti Container -->
            <div id="confetti-container"></div>

            <!-- Birthday Title -->
            <div id="birthday-title">

                <h1>

                    HAPPY BIRTHDAY

                </h1>

                <h2>

                    MY DEEDAH ❤️

                </h2>

            </div>

        </div>

        <!-- ===================================================== -->
        <!-- BIRTHDAY SCREEN                                        -->
        <!-- This will later contain the full birthday experience.  -->
        <!-- ===================================================== -->

      <!-- ===================================================== -->
<!-- BIRTHDAY SCREEN -->
<!-- ===================================================== -->

<div id="birthday-screen">

    <!-- Floating Decorations -->

    <div class="floating-hearts"></div>

    <div class="floating-stars"></div>

    <!-- ================================================= -->
    <!-- HERO CARD -->
    <!-- ================================================= -->

    <div class="hero-card">

        <!-- Left Balloon -->

        <img
            src="assets/images/balloons/balloon-left.png"
            class="balloon balloon-left"
            alt="Balloon">

        <!-- Right Balloon -->

        <img
            src="assets/images/balloons/balloon-right.png"
            class="balloon balloon-right"
            alt="Balloon">

        <!-- Profile -->

        <div class="profile-container">

            <img
                id="birthday-photo"
                src="assets/images/deedah.png"
                alt="My Deedah">

        </div>

        <!-- Main Title -->

        <h1 id="birthday-main-title">

            HAPPY

        </h1>

        <h1 id="birthday-second-title">

            BIRTHDAY

        </h1>

        <h2 id="birthday-name">

            MY DEEDAH ❤️

        </h2>

        <p id="birthday-date"></p>

        <!-- Button -->

        <button id="open-letter-btn">

            💌 Open My Letter

        </button>

    </div>

  <!-- ================================================= -->
<!-- LOVE LETTER -->
<!-- ================================================= -->

<div id="letter-overlay">

    <div id="envelope">

        <!-- Close Button -->

        <button id="close-letter">

            ✕

        </button>

        <!-- Decorative Glow -->

        <div class="envelope-glow"></div>

        <!-- Back -->

        <div class="envelope-back"></div>

        <!-- Left Side -->

        <div class="envelope-left"></div>

        <!-- Right Side -->

        <div class="envelope-right"></div>

        <!-- Bottom -->

        <div class="envelope-bottom"></div>

        <!-- Top Flap -->

        <div class="envelope-flap"></div>

        <!-- Wax Seal -->

        <div class="wax-seal">

            ❤️

        </div>

        <!-- Letter -->

        <div class="letter">

            <div class="letter-paper">

                <h2 id="letter-title"></h2>

                <hr>

                <p id="letter-text"></p>

            </div>

        </div>

    </div>

</div>

</div>

    <!-- ========================================================= -->
    <!-- Main JavaScript                                            -->
    <!-- ========================================================= -->

    <script type="module"
            src="js/app.js"></script>

</body>

</html>
